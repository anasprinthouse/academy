<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Iqbal Academy Admin</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap">
<style>
/* Layout: login card → sticky top bar → stat row → [admissions board | breakdown sidebar] → slide-in detail drawer */
:root{
  --bg:#f2f5f3; --surface:#ffffff; --sunk:#f7f9f8; --ink:#132a26; --muted:#566c67; --line:#dbe4e0;
  --deep:#0e3b36; --on-deep:#eef5f2; --brass:#b2802a; --brass-soft:#f3e7cc; --danger:#b3362b;
  --s-new:#a8701a; --s-new-bg:#fbefd6;
  --s-con:#2d64a8; --s-con-bg:#e2ecf8;
  --s-tri:#7346a8; --s-tri-bg:#eee5f8;
  --s-enr:#1e7a4f; --s-enr-bg:#dcf1e6;
  --s-lost:#6b7472; --s-lost-bg:#eceeed;
  --shadow:0 18px 50px rgba(9,30,27,.18);
  --f-display:"Marcellus","Georgia",serif;
  --f-body:"Nunito Sans","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1513; --surface:#12201d; --sunk:#0f1b18; --ink:#e4eeea; --muted:#9db3ad; --line:#23362f;
  --deep:#0a2e2a; --on-deep:#e8f2ee; --brass:#d6a34b; --brass-soft:#3a2f18; --danger:#ef7d72;
  --s-new:#e7b55a; --s-new-bg:#3a2d14; --s-con:#7fb0ec; --s-con-bg:#16273d;
  --s-tri:#bb98ea; --s-tri-bg:#2a1f3b; --s-enr:#5fd39b; --s-enr-bg:#123326;
  --s-lost:#a3adaa; --s-lost-bg:#1f2826; --shadow:0 18px 50px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1513; --surface:#12201d; --sunk:#0f1b18; --ink:#e4eeea; --muted:#9db3ad; --line:#23362f;
  --deep:#0a2e2a; --on-deep:#e8f2ee; --brass:#d6a34b; --brass-soft:#3a2f18; --danger:#ef7d72;
  --s-new:#e7b55a; --s-new-bg:#3a2d14; --s-con:#7fb0ec; --s-con-bg:#16273d;
  --s-tri:#bb98ea; --s-tri-bg:#2a1f3b; --s-enr:#5fd39b; --s-enr-bg:#123326;
  --s-lost:#a3adaa; --s-lost-bg:#1f2826; --shadow:0 18px 50px rgba(0,0,0,.5); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;line-height:1.2;text-wrap:balance}
.eyebrow{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--brass)}
.muted{color:var(--muted)}

/* Buttons & inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:999px;border:1.5px solid transparent;font-weight:700;font-size:.92rem;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .15s,border-color .15s}
.btn-brass{background:var(--brass);color:#1b1206}
.btn-deep{background:var(--deep);color:var(--on-deep)}
.btn-line{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn-line:hover{border-color:var(--brass)}
.btn-wa{background:#1fa855;color:#fff}
.btn-danger{background:transparent;border-color:color-mix(in srgb,var(--danger) 45%,transparent);color:var(--danger)}
.btn[disabled]{opacity:.55;cursor:default}
.btn svg{width:16px;height:16px;flex:none}
.inp{width:100%;background:var(--sunk);border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;font-size:.92rem}
.inp:focus{outline:none;border-color:var(--brass);box-shadow:0 0 0 3px color-mix(in srgb,var(--brass) 22%,transparent)}
label.lbl{display:block;font-size:.78rem;font-weight:700;color:var(--muted);margin-bottom:5px}

/* Status pill */
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:.76rem;font-weight:800;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st-new{color:var(--s-new);background:var(--s-new-bg)}
.st-con{color:var(--s-con);background:var(--s-con-bg)}
.st-tri{color:var(--s-tri);background:var(--s-tri-bg)}
.st-enr{color:var(--s-enr);background:var(--s-enr-bg)}
.st-lost{color:var(--s-lost);background:var(--s-lost-bg)}

/* Login */
#login{min-height:100%;display:grid;place-items:center;padding-block:clamp(40px,10vh,110px)}
.login-card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:30px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:16px}
.login-card .mark{width:52px;height:52px}
.login-card h1{font-size:1.7rem}
.login-err{color:var(--danger);font-size:.88rem;min-height:1.3em;margin:0}
.hint{font-size:.84rem;color:var(--muted);background:var(--brass-soft);border-radius:10px;padding:10px 12px;margin:0}

/* Top bar */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--deep)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--deep);color:var(--on-deep)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:14px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand svg{width:40px;height:40px;flex:none}
.brand b{display:block;font-family:var(--f-display);font-weight:400;font-size:1.1rem;line-height:1.15}
.brand small{display:block;font-size:.7rem;letter-spacing:.13em;text-transform:uppercase;color:var(--brass);font-weight:800}
.top-actions{display:flex;gap:8px;flex-wrap:wrap}
.top .btn-line{background:transparent;color:var(--on-deep);border-color:rgba(255,255,255,.25)}
.top .btn-line:hover{border-color:var(--brass)}
.sync{font-size:.8rem;opacity:.75;align-self:center}


/* Stats */
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:20px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:2px;text-align:left;cursor:pointer}
.stat:hover{border-color:var(--brass)}
.stat .n{font-family:var(--f-display);font-size:2rem;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .k{font-size:.82rem;color:var(--muted);font-weight:700}
.stat.alert{border-color:color-mix(in srgb,var(--s-new) 55%,transparent);background:var(--s-new-bg)}
.stat.alert .n{color:var(--s-new)}
@media (max-width:980px){.stats{grid-template-columns:repeat(3,1fr)}}
@media (max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}.stat:first-child{grid-column:span 2}.sync{display:none}.top .btn{padding:8px 14px}}

/* Main grid */
.main{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:20px;margin-top:20px;padding-bottom:48px;align-items:start}
.main > *{min-width:0}
@media (max-width:1020px){.main{grid-template-columns:1fr}}

.board{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.board-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.tab{flex:none;display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:999px;border:1.5px solid var(--line);background:var(--sunk);font-weight:700;font-size:.85rem;cursor:pointer;color:var(--muted)}
.tab .c{font-variant-numeric:tabular-nums;font-size:.76rem;background:var(--surface);border-radius:999px;padding:0 7px;color:var(--ink)}
.tab[aria-pressed="true"]{border-color:var(--deep);background:var(--deep);color:var(--on-deep)}
.tab[aria-pressed="true"] .c{background:rgba(255,255,255,.16);color:var(--on-deep)}
.filters{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.3fr) minmax(0,1fr);gap:10px}
@media (max-width:640px){.filters{grid-template-columns:1fr 1fr}.filters .search{grid-column:1/-1}}

/* Rows */
.row-head,.row{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1.4fr) minmax(0,1fr) minmax(0,.9fr) 132px;gap:14px;align-items:center;padding:12px 18px}
.row-head{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;font-weight:800;color:var(--muted);background:var(--sunk);border-bottom:1px solid var(--line)}
.row{border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left;cursor:pointer}
.row:hover{background:var(--sunk)}
.row:last-child{border-bottom:0}
.row .who b{display:block;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .who span,.row .sub{display:block;font-size:.82rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .cell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.9rem}
.row .end{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.row .when{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.tag-f{display:inline-block;margin-left:6px;font-size:.68rem;font-weight:800;color:var(--s-tri);background:var(--s-tri-bg);border-radius:6px;padding:1px 6px;vertical-align:1px}
@media (max-width:760px){
  .row-head{display:none}
  .row{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"who end" "course end" "meta meta";gap:4px 12px;padding:14px 16px}
  .row .who{grid-area:who}.row .c-course{grid-area:course}.row .end{grid-area:end;align-items:flex-end}
  .row .c-country,.row .c-teacher{display:none}
  .row .meta{grid-area:meta;display:block!important;font-size:.8rem;color:var(--muted)}
}
.row .meta{display:none}
.empty{padding:48px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:1.05rem;margin-bottom:4px}
.loading{padding:40px 20px;text-align:center;color:var(--muted)}

/* Sidebar */
.side{display:flex;flex-direction:column;gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
.panel h3{font-size:1.15rem;margin:4px 0 14px}
.bars{display:flex;flex-direction:column;gap:11px}
.bar-l{display:flex;justify-content:space-between;gap:10px;font-size:.85rem;margin-bottom:4px}
.bar-l span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-l span:last-child{font-weight:800;font-variant-numeric:tabular-nums}
.track{height:7px;border-radius:99px;background:var(--sunk);overflow:hidden;border:1px solid var(--line)}
.fill{height:100%;background:var(--brass);border-radius:99px}
.fill.deep{background:var(--deep)}
:root[data-theme="dark"] .fill.deep{background:var(--muted)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .fill.deep{background:var(--muted)}}

/* Drawer */
.scrim{position:fixed;inset:0;background:rgba(6,20,18,.45);z-index:30}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--surface);z-index:31;box-shadow:var(--shadow);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px);animation:slide .22s ease-out}
@keyframes slide{from{transform:translateX(24px);opacity:.4}to{transform:none;opacity:1}}
.d-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.d-head h2{font-size:1.55rem;overflow-wrap:anywhere}
.x{flex:none;width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);background:var(--sunk);cursor:pointer;font-size:1.1rem;line-height:1}
.d-body{flex:1;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:20px}
.statuses{display:flex;flex-wrap:wrap;gap:6px}
.statuses button{border:1.5px solid var(--line);background:var(--sunk);border-radius:999px;padding:6px 12px;font-size:.82rem;font-weight:700;cursor:pointer;color:var(--muted)}
.statuses button[aria-pressed="true"].st-new{border-color:var(--s-new);background:var(--s-new-bg);color:var(--s-new)}
.statuses button[aria-pressed="true"].st-con{border-color:var(--s-con);background:var(--s-con-bg);color:var(--s-con)}
.statuses button[aria-pressed="true"].st-tri{border-color:var(--s-tri);background:var(--s-tri-bg);color:var(--s-tri)}
.statuses button[aria-pressed="true"].st-enr{border-color:var(--s-enr);background:var(--s-enr-bg);color:var(--s-enr)}
.statuses button[aria-pressed="true"].st-lost{border-color:var(--s-lost);background:var(--s-lost-bg);color:var(--s-lost)}
.statuses button:not([aria-pressed="true"]){background:var(--sunk)}
dl.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:9px 16px;margin:0}
dl.facts dt{font-size:.8rem;font-weight:700;color:var(--muted)}
dl.facts dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.phone{font-size:1.15rem;font-weight:800;font-variant-numeric:tabular-nums;user-select:all}
.msg{background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:.92rem}
.acts{display:flex;flex-wrap:wrap;gap:8px}
textarea.inp{min-height:96px;resize:vertical}
.d-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.88rem;color:var(--danger);font-weight:700}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;font-size:.9rem;z-index:40;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.toast.err{background:var(--danger);color:#fff}
</style>
</head><body>

<!-- ================= LOGIN ================= -->
<div id="boot" class="loading" style="padding-top:20vh">Loading…</div>
<div id="login" class="wrap" hidden>
  <form class="login-card" id="loginForm" novalidate>
    <svg class="mark" viewBox="0 0 48 48" aria-hidden="true">
      <path d="M24 2l6.4 15.6L46 24l-15.6 6.4L24 46l-6.4-15.6L2 24l15.6-6.4z" fill="var(--deep)"/>
      <rect x="13" y="13" width="22" height="22" transform="rotate(45 24 24)" fill="none" stroke="var(--brass)" stroke-width="2"/>
      <path d="M16 28c3-1 5.5-1 8 1 2.5-2 5-2 8-1v-9c-3-1-5.5-1-8 1-2.5-2-5-2-8-1z" fill="var(--brass)"/>
    </svg>
    <div>
      <div class="eyebrow">Iqbal Online Quran Academy</div>
      <h1>Admissions admin</h1>
    </div>
    <div>
      <label class="lbl" for="pw">Admin password</label>
      <input class="inp" id="pw" type="password" autocomplete="current-password" placeholder="Enter password">
    </div>
    <p class="login-err" id="loginErr" role="alert"></p>
    <button class="btn btn-deep" id="loginBtn" type="submit">Open dashboard</button>
  </form>
</div>

<!-- ================= APP ================= -->
<div id="app" hidden>
  <header class="top">
    <div class="wrap">
      <div class="brand">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <path d="M24 2l6.4 15.6L46 24l-15.6 6.4L24 46l-6.4-15.6L2 24l15.6-6.4z" fill="var(--brass)"/>
          <rect x="13" y="13" width="22" height="22" transform="rotate(45 24 24)" fill="none" stroke="var(--deep)" stroke-width="2"/>
        </svg>
        <div><b>Iqbal Online Quran Academy</b><small>Admissions admin</small></div>
      </div>
      <div class="top-actions">
        <span class="sync" id="syncTxt"></span>
        <button class="btn btn-line" id="refreshBtn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>Refresh</button>
        <button class="btn btn-line" id="csvBtn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4v11m0 0l-4-4m4 4l4-4M5 19h14"/></svg>Export CSV</button>
        <button class="btn btn-line" id="logoutBtn" type="button">Sign out</button>
      </div>
    </div>
  </header>

  <div class="wrap">

    <div class="stats" id="stats"></div>

    <div class="main">
      <section class="board" aria-label="Admissions">
        <div class="board-head">
          <div class="tabs" id="tabs" role="toolbar" aria-label="Filter by status"></div>
          <div class="filters">
            <input class="inp search" id="q" type="search" placeholder="Search name, phone, country…" aria-label="Search">
            <select class="inp" id="fCourse" aria-label="Course"><option value="">All courses</option></select>
            <select class="inp" id="fTeacher" aria-label="Teacher">
              <option value="">Any teacher</option><option>Male teacher</option><option>Female teacher</option>
            </select>
          </div>
        </div>
        <div class="row-head" aria-hidden="true"><span>Student</span><span>Course</span><span>Country · time</span><span>Teacher</span><span>Status</span></div>
        <div id="list"><div class="loading">Loading admissions…</div></div>
      </section>

      <aside class="side">
        <div class="panel">
          <div class="eyebrow">Demand</div>
          <h3>By course</h3>
          <div class="bars" id="byCourse"></div>
        </div>
        <div class="panel">
          <div class="eyebrow">Where students are</div>
          <h3>Top countries</h3>
          <div class="bars" id="byCountry"></div>
        </div>
      </aside>
    </div>
  </div>
</div>

<!-- ================= DRAWER ================= -->
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden role="dialog" aria-modal="true" aria-labelledby="dName">
  <div class="d-head">
    <div style="min-width:0">
      <div class="eyebrow" id="dWhen"></div>
      <h2 id="dName"></h2>
    </div>
    <button class="x" id="dClose" type="button" aria-label="Close">✕</button>
  </div>
  <div class="d-body">
    <div>
      <label class="lbl">Status</label>
      <div class="statuses" id="dStatuses"></div>
    </div>
    <div>
      <label class="lbl">WhatsApp</label>
      <div class="phone" id="dPhone"></div>
      <div class="acts" style="margin-top:10px">
        <a class="btn btn-wa" id="dWa" href="#" target="_blank" rel="noopener">
          <svg viewBox="0 0 32 32" fill="currentColor"><path d="M16 3a13 13 0 0 0-11.2 19.6L3 29l6.6-1.7A13 13 0 1 0 16 3zm0 23.6c-2 0-4-.6-5.7-1.6l-.4-.2-3.9 1 1-3.8-.3-.4A10.6 10.6 0 1 1 16 26.6z"/></svg>Message on WhatsApp</a>
        <button class="btn btn-line" id="dCopy" type="button">Copy number</button>
      </div>
    </div>
    <dl class="facts" id="dFacts"></dl>
    <div id="dMsgWrap">
      <label class="lbl">Their message</label>
      <div class="msg" id="dMsg"></div>
    </div>
    <div>
      <label class="lbl" for="dNotes">Admin notes (only you see these)</label>
      <textarea class="inp" id="dNotes" placeholder="e.g. Trial booked Mon 6pm with Qari Sahab, father prefers evenings"></textarea>
    </div>
  </div>
  <div class="d-foot">
    <div id="delArea"><button class="btn btn-danger" id="dDel" type="button">Delete</button></div>
    <button class="btn btn-deep" id="dSave" type="button">Save changes</button>
  </div>
</aside>

<div class="toast" id="toast" role="status" hidden></div>

<script>
(function(){
  var STATUSES=[
    {v:'New',c:'st-new'},{v:'Contacted',c:'st-con'},{v:'Trial scheduled',c:'st-tri'},
    {v:'Enrolled',c:'st-enr'},{v:'Not interested',c:'st-lost'}];
  var COURSES=['Noorani Qaida (Beginners)','Nazra Quran with Tajweed','Hifz-ul-Quran (Memorization)',
    'Quran Translation & Tafseer','Islamic Studies for Kids','Namaz, Duas & Masnoon Kalimay'];
  var ACADEMY='Iqbal Online Quran Academy';

  /* ---------- server API (Vercel functions) ---------- */
  function api(action,body){
    return fetch('/api/admin?action='+action,{
      method:body?'POST':'GET',credentials:'same-origin',
      headers:body?{'Content-Type':'application/json'}:{},
      body:body?JSON.stringify(body):undefined
    }).then(function(r){
      return r.json().catch(function(){return {}}).then(function(j){
        if(!r.ok||!j.ok){var e=new Error(j.error||('Server error '+r.status));e.status=r.status;throw e}
        return j;
      });
    });
  }
  function handle(err){
    if(err.status===401){showLogin(err.message==='signin'?'Your session ended. Sign in again.':err.message);return}
    toast(err.message||'Something went wrong',true);
  }

  /* ---------- helpers ---------- */
  var $=function(id){return document.getElementById(id)};
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function stClass(v){var s=STATUSES.find(function(x){return x.v===v});return s?s.c:'st-new'}
  function rel(iso){
    var t=Date.parse(iso); if(!t)return '';
    var m=(Date.now()-t)/6e4;
    if(m<1)return 'just now'; if(m<60)return Math.floor(m)+' min ago';
    var h=m/60; if(h<24)return Math.floor(h)+' h ago';
    var d=h/24; if(d<7)return Math.floor(d)+(Math.floor(d)===1?' day ago':' days ago');
    return new Date(t).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'});
  }
  function full(iso){var t=Date.parse(iso);return t?new Date(t).toLocaleString(undefined,{weekday:'short',day:'numeric',month:'short',hour:'numeric',minute:'2-digit'}):''}
  function waNumber(p){
    var d=String(p||'').replace(/[^\d+]/g,'');
    if(d.indexOf('+')===0)return d.slice(1).replace(/\D/g,'');
    d=d.replace(/\D/g,'');
    if(d.indexOf('00')===0)return d.slice(2);
    if(d.length===11&&d.indexOf('03')===0)return '92'+d.slice(1);   // Pakistani 03xx
    return d;
  }
  var toastT;
  function toast(msg,isErr){var t=$('toast');t.textContent=msg;t.className='toast'+(isErr?' err':'');t.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true},2600)}

  /* ---------- state ---------- */
  var signedIn=false, rows=[], filter={status:'All',q:'',course:'',teacher:''}, current=null, lastSync=0;

  /* ---------- login ---------- */
  function showLogin(msg){
    signedIn=false; rows=[]; closeDrawer();
    $('boot').hidden=true; $('app').hidden=true; $('login').hidden=false;
    $('loginErr').textContent=msg||''; $('pw').value=''; $('pw').focus();
  }
  $('loginForm').addEventListener('submit',function(e){
    e.preventDefault();
    var v=$('pw').value; if(!v){$('loginErr').textContent='Enter the admin password.';return}
    $('loginErr').textContent=''; $('loginBtn').disabled=true; $('loginBtn').textContent='Checking…';
    api('login',{password:v}).then(function(){return api('list')}).then(enter)
      .catch(function(err){$('loginErr').textContent=err.message||'Could not sign in.'})
      .then(function(){$('loginBtn').disabled=false;$('loginBtn').textContent='Open dashboard'});
  });
  function enter(data){
    signedIn=true; $('boot').hidden=true; $('login').hidden=true; $('app').hidden=false;
    apply(data);
  }
  $('logoutBtn').addEventListener('click',function(){
    api('logout',{}).catch(function(){}).then(function(){showLogin('Signed out.')});
  });

  function apply(data){
    rows=(data.rows||[]).slice().sort(function(a,b){return Date.parse(b.submitted)-Date.parse(a.submitted)});
    lastSync=Date.now(); render();
  }
  function refresh(quiet){
    if(!signedIn)return;
    $('refreshBtn').disabled=true;
    api('list').then(apply).then(function(){if(!quiet)toast('Up to date')})
      .catch(function(err){if(!quiet||err.status===401)handle(err)})
      .then(function(){$('refreshBtn').disabled=false});
  }
  $('refreshBtn').addEventListener('click',function(){refresh(false)});
  setInterval(function(){if(signedIn&&!document.hidden&&$('drawer').hidden)refresh(true)},90000);
  setInterval(updateSync,30000);
  function updateSync(){$('syncTxt').textContent=lastSync?'Updated '+rel(new Date(lastSync).toISOString()):''}

  /* ---------- filters ---------- */
  COURSES.forEach(function(c){var o=document.createElement('option');o.textContent=c;$('fCourse').appendChild(o)});
  $('q').addEventListener('input',function(){filter.q=this.value.trim().toLowerCase();renderList()});
  $('fCourse').addEventListener('change',function(){filter.course=this.value;renderList()});
  $('fTeacher').addEventListener('change',function(){filter.teacher=this.value;renderList()});

  function visible(){
    return rows.filter(function(r){
      if(filter.status!=='All'&&r.status!==filter.status)return false;
      if(filter.course&&r.course!==filter.course)return false;
      if(filter.teacher&&r.teacher!==filter.teacher)return false;
      if(filter.q){var hay=(r.name+' '+r.phone+' '+r.country+' '+r.course+' '+r.notes).toLowerCase();if(hay.indexOf(filter.q)<0)return false}
      return true;
    });
  }

  /* ---------- render ---------- */
  function render(){renderStats();renderTabs();renderList();renderBars();updateSync()}

  function count(fn){return rows.filter(fn).length}
  function renderStats(){
    var week=Date.now()-7*864e5;
    var s=[
      {k:'Waiting for reply',n:count(function(r){return r.status==='New'}),go:'New',alert:true},
      {k:'New this week',n:count(function(r){return Date.parse(r.submitted)>week}),go:'All'},
      {k:'Trial scheduled',n:count(function(r){return r.status==='Trial scheduled'}),go:'Trial scheduled'},
      {k:'Enrolled',n:count(function(r){return r.status==='Enrolled'}),go:'Enrolled'},
      {k:'Want a female teacher',n:count(function(r){return r.teacher==='Female teacher'}),go:'All',teacher:'Female teacher'}
    ];
    $('stats').innerHTML=s.map(function(x,i){
      return '<button type="button" class="stat'+(x.alert&&x.n?' alert':'')+'" data-i="'+i+'"><span class="n">'+x.n+'</span><span class="k">'+esc(x.k)+'</span></button>';
    }).join('');
    [].forEach.call($('stats').children,function(b){
      b.addEventListener('click',function(){
        var x=s[+b.dataset.i]; filter.status=x.go; filter.teacher=x.teacher||''; $('fTeacher').value=filter.teacher;
        renderTabs(); renderList();
      });
    });
  }
  function renderTabs(){
    var opts=[{v:'All',n:rows.length}].concat(STATUSES.map(function(s){return {v:s.v,n:count(function(r){return r.status===s.v})}}));
    $('tabs').innerHTML=opts.map(function(o){
      return '<button type="button" class="tab" aria-pressed="'+(filter.status===o.v)+'" data-v="'+esc(o.v)+'">'+esc(o.v)+'<span class="c">'+o.n+'</span></button>';
    }).join('');
    [].forEach.call($('tabs').children,function(b){b.addEventListener('click',function(){filter.status=b.dataset.v;renderTabs();renderList()})});
  }
  function renderList(){
    var list=visible(), el=$('list');
    if(!rows.length){el.innerHTML='<div class="empty"><b>No admissions yet</b>New forms from the website will appear here, newest first.</div>';return}
    if(!list.length){el.innerHTML='<div class="empty"><b>Nothing matches</b>Try another status, course or search.</div>';return}
    el.innerHTML=list.map(function(r){
      return '<button type="button" class="row" data-id="'+esc(r.id)+'">'+
        '<span class="who"><b>'+esc(r.name)+'</b><span>Age '+esc(r.age)+' · '+esc(r.gender)+'</span></span>'+
        '<span class="cell c-course">'+esc(r.course)+'</span>'+
        '<span class="c-country"><span class="cell" style="display:block">'+esc(r.country)+'</span><span class="sub">'+esc(r.time)+'</span></span>'+
        '<span class="cell c-teacher">'+(r.teacher==='Female teacher'?'<span class="tag-f" style="margin:0">Female</span>':esc((r.teacher||'—').replace(' teacher','')))+'</span>'+
        '<span class="end"><span class="pill '+stClass(r.status)+'">'+esc(r.status)+'</span><span class="when">'+esc(rel(r.submitted))+'</span></span>'+
        '<span class="meta">'+esc(r.country)+' · '+esc(r.time)+' · '+esc(r.teacher)+'</span>'+
      '</button>';
    }).join('');
    [].forEach.call(el.querySelectorAll('.row'),function(b){b.addEventListener('click',function(){openDrawer(b.dataset.id)})});
  }
  function bars(el,pairs,cls){
    if(!pairs.length){el.innerHTML='<p class="muted" style="margin:0;font-size:.88rem">No data yet.</p>';return}
    var max=Math.max.apply(null,pairs.map(function(p){return p[1]}));
    el.innerHTML=pairs.map(function(p){
      return '<div><div class="bar-l"><span>'+esc(p[0])+'</span><span>'+p[1]+'</span></div><div class="track"><div class="fill '+(cls||'')+'" style="width:'+(p[1]/max*100).toFixed(1)+'%"></div></div></div>';
    }).join('');
  }
  function tally(key){var m={};rows.forEach(function(r){var k=(r[key]||'Not given').trim();m[k]=(m[k]||0)+1});return Object.keys(m).map(function(k){return [k,m[k]]}).sort(function(a,b){return b[1]-a[1]})}
  function renderBars(){bars($('byCourse'),tally('course'));bars($('byCountry'),tally('country').slice(0,6),'deep')}

  /* ---------- drawer ---------- */
  var draftStatus='';
  function openDrawer(id){
    current=rows.find(function(r){return r.id===id}); if(!current)return;
    draftStatus=current.status||'New';
    $('dName').textContent=current.name;
    $('dWhen').textContent='Submitted '+full(current.submitted);
    $('dPhone').textContent=current.phone;
    var msg='Assalam o Alaikum! This is '+ACADEMY+' about the admission request for '+current.name+' ('+current.course+'). When would be a good time for the free trial class?';
    $('dWa').href='https://wa.me/'+waNumber(current.phone)+'?text='+encodeURIComponent(msg);
    var facts=[['Age',current.age],['Gender',current.gender],['Country',current.country],['Course',current.course],['Teacher',current.teacher],['Preferred time',current.time]];
    $('dFacts').innerHTML=facts.map(function(f){return '<dt>'+esc(f[0])+'</dt><dd>'+esc(f[1]||'—')+'</dd>'}).join('');
    $('dMsgWrap').hidden=!current.message; $('dMsg').textContent=current.message||'';
    $('dNotes').value=current.notes||'';
    renderStatusBtns(); resetDel();
    $('scrim').hidden=false; $('drawer').hidden=false; $('dClose').focus();
  }
  function renderStatusBtns(){
    $('dStatuses').innerHTML=STATUSES.map(function(s){return '<button type="button" class="'+s.c+'" aria-pressed="'+(draftStatus===s.v)+'" data-v="'+esc(s.v)+'">'+esc(s.v)+'</button>'}).join('');
    [].forEach.call($('dStatuses').children,function(b){b.addEventListener('click',function(){draftStatus=b.dataset.v;renderStatusBtns()})});
  }
  function closeDrawer(){$('drawer').hidden=true;$('scrim').hidden=true;current=null}
  $('dClose').addEventListener('click',closeDrawer);
  $('scrim').addEventListener('click',closeDrawer);
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!$('drawer').hidden)closeDrawer()});

  $('dCopy').addEventListener('click',function(){
    var t=current?current.phone:''; var b=this;
    var ok=function(){b.textContent='Copied';setTimeout(function(){b.textContent='Copy number'},1500)};
    try{navigator.clipboard.writeText(t).then(ok,function(){selectPhone()})}catch(e){selectPhone()}
  });
  function selectPhone(){var r=document.createRange();r.selectNodeContents($('dPhone'));var s=getSelection();s.removeAllRanges();s.addRange(r);toast('Number selected, press copy')}

  $('dSave').addEventListener('click',function(){
    if(!current)return;
    var ch={status:draftStatus,notes:$('dNotes').value.trim()}, r=current, btn=this;
    btn.disabled=true; btn.textContent='Saving…';
    api('update',{id:r.id,status:ch.status,notes:ch.notes}).then(function(res){
      r.status=ch.status; r.notes=ch.notes; r.updated=res&&res.updated;
      render(); closeDrawer(); toast('Saved: '+r.name+' is now '+ch.status);
    }).catch(handle)
      .then(function(){btn.disabled=false;btn.textContent='Save changes'});
  });

  function resetDel(){$('delArea').innerHTML='<button class="btn btn-danger" id="dDel" type="button">Delete</button>';$('dDel').addEventListener('click',askDel)}
  function askDel(){
    $('delArea').innerHTML='<span class="confirm">Delete for good? <button class="btn btn-danger" id="dYes" type="button">Yes, delete</button><button class="btn btn-line" id="dNo" type="button">Keep</button></span>';
    $('dNo').addEventListener('click',resetDel);
    $('dYes').addEventListener('click',function(){
      var r=current; this.disabled=true;
      api('delete',{id:r.id}).then(function(){
        rows=rows.filter(function(x){return x.id!==r.id}); render(); closeDrawer(); toast('Deleted '+r.name);
      }).catch(function(err){resetDel();handle(err)});
    });
  }

  /* ---------- CSV export ---------- */
  $('csvBtn').addEventListener('click',function(){
    var cols=['submitted','name','age','gender','country','phone','course','teacher','time','message','status','notes'];
    var q=function(v){v=String(v==null?'':v);if(/^[=+\-@]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'};
    var csv=[cols.join(',')].concat(visible().map(function(r){return cols.map(function(c){return q(r[c])}).join(',')})).join('\r\n');
    var a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));
    a.download='admissions-'+new Date().toISOString().slice(0,10)+'.csv';
    document.body.appendChild(a);a.click();a.remove();
    toast('Exported '+visible().length+' admissions');
  });

  /* ---------- start: already signed in? ---------- */
  api('list').then(enter).catch(function(err){showLogin(err.status===401&&err.message==='signin'?'':err.message)});
})();
</script>
</body></html>
